apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-temporal
  labels:
    app: user-temporal
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: user-temporal
  template:
    metadata:
      name: user-temporal
      labels:
        app: user-temporal
    spec:
      initContainers:
        - name: user-migrator
          image: user:latest
          imagePullPolicy: Never
          args:
            - migrate
          env:
            - name: USER_DATABASE_HOST
              value: mysql.infrastructure.svc.cluster.local:3306
            - name: USER_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: user-database-access
                  key: USER_DATABASE_NAME
            - name: USER_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: user-database-access
                  key: USER_DATABASE_USER
            - name: USER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-database-access
                  key: USER_DATABASE_PASSWORD
      containers:
        - name: user-temporal
          image: user:latest
          livenessProbe:
            httpGet:
              port: http
              path: /healthz
          readinessProbe:
            httpGet:
              port: http
              path: /healthz
          imagePullPolicy: Never
          args:
            - workflow-worker
          env:
            - name: USER_SERVICE_GRACE_PERIOD
              value: "15s"
            - name: USER_SERVICE_GRPC_ADDRESS
              value: ":8081"
            - name: USER_SERVICE_HTTP_ADDRESS
              value: ":8082"
            - name: USER_DATABASE_MAX_CONNECTIONS
              value: "20"
            - name: USER_DATABASE_CONNECTIONS_MAX_LIFE_TIME
              value: "10m"
            - name: USER_DATABASE_CONNECTIONS_MAX_IDLE_TIME
              value: "1m"
            - name: USER_DATABASE_HOST
              value: mysql.infrastructure.svc.cluster.local:3306
            - name: USER_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: user-database-access
                  key: USER_DATABASE_NAME
            - name: USER_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: user-database-access
                  key: USER_DATABASE_USER
            - name: USER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-database-access
                  key: USER_DATABASE_PASSWORD
            - name: USER_TEMPORAL_HOST
              value: temporal.infrastructure.svc.cluster.local:7233
          ports:
            - containerPort: 8082
              protocol: TCP
              name: http
      restartPolicy: Always
      