apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: application
spec:
  selector:
    app: payment-api
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  labels:
    app: payment-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      name: payment-api
      labels:
        app: payment-api
    spec:
      initContainers:
        - name: payment-migrator
          image: payment:latest
          imagePullPolicy: Never
          args:
            - migrate
          env:
            - name: PAYMENT_DATABASE_HOST
              value: mysql.infrastructure.svc.cluster.local:3306
            - name: PAYMENT_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_NAME
            - name: PAYMENT_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_USER
            - name: PAYMENT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_PASSWORD
      containers:
        - name: payment-api
          image: payment:latest
          livenessProbe:
            httpGet:
              port: http
              path: /healthz
          readinessProbe:
            httpGet:
              port: http
              path: /healthz
          imagePullPolicy: Never
          args:
            - service
          env:
            - name: PAYMENT_SERVICE_GRACE_PERIOD
              value: "15s"
            - name: PAYMENT_SERVICE_GRPC_ADDRESS
              value: ":8081"
            - name: PAYMENT_SERVICE_HTTP_ADDRESS
              value: ":8082"
            - name: PAYMENT_DATABASE_MAX_CONNECTIONS
              value: "20"
            - name: PAYMENT_DATABASE_CONNECTIONS_MAX_LIFE_TIME
              value: "10m"
            - name: PAYMENT_DATABASE_CONNECTIONS_MAX_IDLE_TIME
              value: "1m"
            - name: PAYMENT_DATABASE_HOST
              value: mysql.infrastructure.svc.cluster.local:3306
            - name: PAYMENT_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_NAME
            - name: PAYMENT_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_USER
            - name: PAYMENT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_PASSWORD
          ports:
            - containerPort: 8081
              protocol: TCP
              name: grpc
            - containerPort: 8082
              protocol: TCP
              name: http
      restartPolicy: Always
      