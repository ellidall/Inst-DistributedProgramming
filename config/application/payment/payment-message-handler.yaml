apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-message-handler
  labels:
    app: payment-message-handler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payment-message-handler
  template:
    metadata:
      name: payment-message-handler
      labels:
        app: payment-message-handler
    spec:
      initContainers:
        - name: payment-migrator
          image: payment:latest
          imagePullPolicy: Never
          args:
            - migrate
          env:
            - name: PAYMENT_DATABASE_HOST
              value: mysql.infrastructure.svc.cluster.local:3306
            - name: PAYMENT_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_NAME
            - name: PAYMENT_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_USER
            - name: PAYMENT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_PASSWORD
      containers:
        - name: payment-message-handler
          image: payment:latest
          livenessProbe:
            httpGet:
              port: http
              path: /healthz
          readinessProbe:
            httpGet:
              port: http
              path: /healthz
          imagePullPolicy: Never
          args:
            - message-handler
          env:
            - name: PAYMENT_SERVICE_GRACE_PERIOD
              value: "15s"
            - name: PAYMENT_SERVICE_GRPC_ADDRESS
              value: ":8081"
            - name: PAYMENT_SERVICE_HTTP_ADDRESS
              value: ":8082"
            - name: PAYMENT_DATABASE_MAX_CONNECTIONS
              value: "20"
            - name: PAYMENT_DATABASE_CONNECTIONS_MAX_LIFE_TIME
              value: "10m"
            - name: PAYMENT_DATABASE_CONNECTIONS_MAX_IDLE_TIME
              value: "1m"
            - name: PAYMENT_DATABASE_HOST
              value: mysql.infrastructure.svc.cluster.local:3306
            - name: PAYMENT_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_NAME
            - name: PAYMENT_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_USER
            - name: PAYMENT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-database-access
                  key: PAYMENT_DATABASE_PASSWORD
            - name: PAYMENT_AMQP_HOST
              value: rabbitmq.infrastructure.svc.cluster.local:5672
            - name: PAYMENT_AMQP_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: rabbitmq-username
            - name: PAYMENT_AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: rabbitmq-password
            - name: PAYMENT_TEMPORAL_HOST
              value: temporal.infrastructure.svc.cluster.local:7233
          ports:
            - containerPort: 8081
              protocol: TCP
              name: grpc
            - containerPort: 8082
              protocol: TCP
              name: http
      restartPolicy: Always
      