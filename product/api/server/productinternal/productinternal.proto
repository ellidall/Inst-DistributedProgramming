syntax = "proto3";
package product;

option go_package = "/.;productinternal";

service ProductInternalService {
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
  int32 stock = 3;
}

message CreateProductResponse {
  string productID = 1;
}